headline: More than a VA. A systems-thinker in your corner.
paragraphs:
  - >-
    Before pivoting to virtual assistance, I spent years as a licensed pharmacist
    managing medication supply chains for an entire state, coordinating logistics
    between government ministries, hospitals, and field teams while ensuring
    compliance in environments where errors simply weren't an option.
  - >-
    That background shaped how I work. I bring clinical-grade precision to inbox
    management, the supply-chain discipline of a logistics officer to project
    tracking, and the stakeholder fluency of someone who's liaised across
    government agencies under real operational pressure.
  - >-
    When you bring me onto your team, you're adding someone who anticipates
    bottlenecks before they happen, communicates with clarity, and protects your
    time like it's the most valuable asset in the room. Because it is.
pullQuote: >-
  I don't just execute tasks — I protect the conditions that allow you to do
  your best work.
credential: B.Pharm · Licensed Pharmacist
